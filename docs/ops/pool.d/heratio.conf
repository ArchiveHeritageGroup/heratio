; #1446 - dedicated php-fpm pool for heratio.org (prod), isolated from the shared
; www pool so a heavy co-tenant job can't starve production. Mirrors www.conf's
; directives; own socket + reserved worker budget.
[heratio]
user = www-data
group = www-data
listen = /run/php-fpm.heratio.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = dynamic
pm.max_children = 25
pm.start_servers = 6
pm.min_spare_servers = 4
pm.max_spare_servers = 12
pm.max_requests = 500
pm.status_path = /fpm-status
slowlog = /var/log/php8.3-fpm.heratio.slow.log
request_slowlog_timeout = 5s
request_terminate_timeout = 90s
catch_workers_output = no
php_admin_value[error_reporting] = E_ALL & ~E_NOTICE & ~E_WARNING & ~E_DEPRECATED & ~E_STRICT
php_admin_flag[display_errors] = Off
php_admin_value[error_log] = /var/log/php-psis-error.log
php_admin_flag[log_errors] = on
