# Load-shedding for Heratio's faceted browse endpoints.
#
# WHY NOT per-IP: on 2026-08-24 heratio.org took 36,157 requests to
# /actor/browse from 31,722 DISTINCT IPs - about one request per address, with
# rotating desktop-browser user agents. A per-IP limit is exactly what that
# traffic is shaped to defeat, and the existing $block_facet_crawl guard cannot
# see it either: that fires only on a bot-shaped User-Agent AND bracket array
# params (AtoM's creator%5B0%5D=), and this has neither - Heratio's facets are
# flat (maintainedBy=, sf_culture=, displayMode=).
#
# WHY NOT caching: 28,063 of the 30,445 distinct URLs were requested exactly
# once, so the best possible hit ratio is ~9%. A facet space is not cacheable
# by construction.
#
# So the key is $server_name - ONE counter for the whole vhost, i.e. a global
# cap on how many browse requests may be in flight at once. The pool is
# pm.max_children=25 and every page costs ~1s, so capping browse at 12 leaves
# 13 workers for the rest of the site. Excess browse requests are refused
# immediately instead of queueing and starving everything else, which is what
# produced the intermittent 502s a user reported as an authority-record error.
limit_conn_zone $server_name zone=heratio_browse:1m;
