# =============================================================================
# nginx snippet - proxy /iiif/ to local Cantaloupe
# =============================================================================
# Add INSIDE your existing Heratio server { ... } block. The ^~ prefix is
# critical: it stops nginx's static-file regex (e.g. \.(jpg|png)$ at the bottom
# of the vhost) from intercepting tile requests. Without ^~ the regex location
# wins and tiles return 404.
#
# Reconciled with the live configuration on 2026-08-12 (#1465). The template had
# drifted from what actually works; the differences that mattered are marked
# below so they are not "tidied" back out.
# =============================================================================

# Laravel passthroughs that share the /iiif/ prefix with Cantaloupe.
# Longer ^~ prefixes and = exact matches win over the broader ^~ /iiif/
# block below, so these stay on the Laravel app. They MUST stay above it:
# `location ^~ /iiif/` would otherwise swallow them and hand IIIF Auth and
# Content State to Cantaloupe, which knows nothing about them.
# Refs: issue #733, #695 Change Discovery, #696 Auth 2.0 + Content State,
# #699 workspace admin, #1465 (the /iiif/3d/ passthrough was missing here and
# only existed live).
location = /iiif/discovery/changes { try_files $uri /index.php?$query_string; }
location ^~ /iiif/auth/2/          { try_files $uri /index.php?$query_string; }
location ^~ /iiif/content-state/   { try_files $uri /index.php?$query_string; }
location = /iiif/workspaces        { try_files $uri /index.php?$query_string; }
location ^~ /iiif/3d/              { try_files $uri /index.php?$query_string; }

location ^~ /iiif/ {
    proxy_pass http://127.0.0.1:{{HTTP_PORT}}/iiif/;
    proxy_http_version 1.1;

    # $http_host, NOT $host. #1465: $host drops the port, so on any instance not
    # served on the default port Cantaloupe builds a port-less info.json "id",
    # the viewer then requests tiles from an origin the page CSP (img-src 'self')
    # rejects, and Mirador/OpenSeadragon render blank with no useful error.
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host  $host;
    # Cantaloupe builds its public URLs from X-Forwarded-*; without the port the
    # id is wrong on non-443/80 instances. Same root cause as above.
    proxy_set_header X-Forwarded-Port  $server_port;
    proxy_set_header X-Forwarded-Proto $scheme;

    # IIIF auth: forward cookies + Authorization to delegates.rb authorize()
    proxy_set_header Cookie            $http_cookie;
    proxy_set_header Authorization     $http_authorization;

    proxy_connect_timeout 5s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # CORS for cross-origin viewers (Mirador, OpenSeadragon embeds)
    add_header Access-Control-Allow-Origin  "*" always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept, Authorization" always;

    # Backstop: rewrite any absolute upstream URL that still leaks into a JSON
    # body. Belt-and-braces alongside the X-Forwarded-* headers above.
    sub_filter_types application/json application/ld+json;
    sub_filter_once off;
    sub_filter 'http://127.0.0.1:{{HTTP_PORT}}' '$scheme://$http_host';

    # Tile cache - Cantaloupe handles this internally too
    proxy_buffering on;
    proxy_cache_valid 200 30d;
}
