name: Translation lint

# Two checks, guarding the two ways a string can fail to reach a translator.
#
# 1. Hardcoded UI string scan - strings never wrapped in __(), so the
#    multilingual layer (issue #34) can never see them. Since #1597 this is
#    gated by a shrink-only baseline (tools/translation-lint-baseline.txt):
#    CI fails on any hardcoded string that is not already in the baseline.
# 2. Locale key extraction - strings correctly wrapped in __() but never
#    harvested into lang/en.json. __() falls back to rendering the key, so
#    these display as English with nothing reporting a problem. This is how
#    en.json came to cover only 27% of the interface before #1420.
#
# Tuning the thresholds: bump either when the absolute count has been
# reduced. The point is not to hit zero — it's to ensure new code doesn't
# push the count up.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  # Hardcoded UI strings are no longer gated by an absolute cap (#1597). The
  # old cap (30) only covered headings, buttons, labels, options and a few
  # attributes; the scan now also reads every text node and PHP flash message,
  # which put the backlog at ~3,600. The known backlog lives in
  # tools/translation-lint-baseline.txt and the job fails only on NEW strings.
  # When you fix strings, run `php artisan ahg:translation-lint --baseline`
  # and commit the shorter file. The deliberate exceptions noted before (TK/BC
  # Local Contexts codes, MIME types, PRONOM ids, URL examples, the literal
  # RESTORE confirmation word) stay in the baseline.

  # Absolute cap on __() keys present in code but missing from lang/en.json.
  # #1420 harvested 13,955 keys and took this to 0; it has since drifted to
  # ~64. Set to 100 for headroom, and ratchet down as the backlog clears.
  EXTRACT_THRESHOLD: 100

jobs:
  lint:
    name: Hardcoded UI string scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, json, dom, libxml
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Run translation lint
        id: lint
        run: |
          set -o pipefail
          # Capture full output so we can post a comment on PRs. Keep the exit
          # code and fail at the end, so the totals below are recorded even
          # when new hardcoded strings fail the check.
          rc=0
          php artisan ahg:translation-lint --check \
              | tee lint-output.txt || rc=$?
          # Capture totals from the line "Found N candidate hardcoded UI strings in M files"
          if grep -qE 'Found ([0-9]+) candidate' lint-output.txt; then
            count=$(grep -oE 'Found [0-9]+' lint-output.txt | head -1 | awk '{print $2}')
            files=$(grep -oE 'in [0-9]+ files' lint-output.txt | head -1 | awk '{print $2}')
            echo "count=${count}" >> $GITHUB_OUTPUT
            echo "files=${files}" >> $GITHUB_OUTPUT
          fi
          exit $rc

      - name: Check locale coverage + malformed files (#1410)
        run: |
          set -o pipefail
          # Prints the per-locale coverage table (drift is visible on every run)
          # and FAILS the build if any lang/*.json is not a JSON object - the
          # #1410 malformed-locale-file regression guard. Does not gate on
          # coverage % (that is machine-fill work tracked in #1410/#1416).
          php artisan ahg:translation-coverage | tee coverage-output.txt

      - name: Comment on PR with lint summary
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('lint-output.txt', 'utf8');
            const count = '${{ steps.lint.outputs.count }}';
            const status = '${{ steps.lint.outcome }}' === 'success' ? '✅ OK' : '❌ FAIL';
            const newCount = (output.match(/^(\d+) NEW hardcoded/m) || [, '0'])[1];
            const body = [
              '### Translation lint ' + status,
              '',
              `New hardcoded UI strings: **${newCount}** (total incl. baseline backlog: ${count})`,
              '',
              '<details><summary>Lint output (click to expand)</summary>',
              '',
              '```',
              output.substring(0, 4000),
              '```',
              '',
              '</details>',
              '',
              '_To fix: wrap user-visible strings in `{{ __(\'…\') }}` (Blade) or `__(\'…\')` (PHP)._',
              '_Fixed some? Run `php artisan ahg:translation-lint --baseline` and commit the shorter `tools/translation-lint-baseline.txt`._'
            ].join('\n');
            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            } catch (error) {
              core.warning(`Could not post the translation-lint PR comment: ${error.message}`);
              await core.summary.addHeading('Translation lint').addRaw(body).write();
            }

  extract:
    name: Locale key extraction
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, json, dom, libxml
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Check for __() keys missing from lang/en.json
        run: |
          set -o pipefail
          # --dry-run so CI never writes the locale file; the command exits
          # non-zero when the missing count exceeds the threshold.
          if ! php artisan ahg:translation-extract \
                 --dry-run \
                 --top=15 \
                 --fail-above=$EXTRACT_THRESHOLD \
                 | tee extract-output.txt; then
            echo ""
            echo "::error::Translation keys exist in the codebase but are missing from lang/en.json."
            echo "These strings render as English because __() falls back to the key, and no"
            echo "translator can reach them. Run: php artisan ahg:translation-extract"
            echo "Then commit the updated lang/en.json."
            echo "To raise the cap instead, edit EXTRACT_THRESHOLD in this workflow."
            exit 1
          fi
