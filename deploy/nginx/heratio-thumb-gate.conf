# Install in /etc/nginx/conf.d/. Short-lived verdict cache for the thumbnail gate,
# so a browse grid does not boot PHP for every tile on every page view.
# ponytail: a verdict can be up to 60 seconds old, so a record just withdrawn may
# show its thumbnail for up to a minute. Shorten proxy_cache_valid if that matters.
proxy_cache_path /var/cache/nginx/heratio_thumb_gate levels=1:2 keys_zone=heratio_thumb_gate:10m max_size=256m inactive=10m;
map $http_cookie $heratio_session {
    "~(?:^|;\s*)heratio[-a-z]*session=(?<heratio_sid>[^;]+)" $heratio_sid;
    default "";
}
