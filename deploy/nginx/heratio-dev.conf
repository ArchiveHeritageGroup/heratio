##
# Heratio DEV — LAN-only dev sandbox on :8090 (no SSL, not public).
# Code: /usr/share/nginx/heratio-dev   DB: heratio_dev   content store: shared /mnt/nas/heratio
##
server {
    include snippets/bad-bot-guard.conf;
    listen 8090;
    listen [::]:8090;
    server_name _;

    client_max_body_size 2G;
    root /usr/share/nginx/heratio-dev/public;
    index index.php;

    access_log /var/log/nginx/heratio-dev_access.log;
    error_log  /var/log/nginx/heratio-dev_error.log;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Digital object uploads — SHARED content store (same NAS as live)
    location ^~ /uploads/condition_photos/ {
        alias /mnt/nas/heratio-dev/uploads/condition_photos/;
        add_header Access-Control-Allow-Origin "*" always;
    }
    # heratio#1361 — AR animations are gated by the app (publication-status + ODRL)
    # and delivered via X-Accel-Redirect; this location is `internal` so the bytes
    # are NOT directly fetchable at /uploads/ar/... bypassing the gate.
    location ^~ /uploads/ar/ {
        internal;
        alias /mnt/nas/heratio-dev/uploads/ar/;
    }
    location ^~ /uploads/ {
        alias /mnt/nas/heratio-dev/uploads/;
        add_header Access-Control-Allow-Origin "*" always;
    }
    location /generic-icons/ { alias /usr/share/nginx/archive/images/generic-icons/; }

    # RiC explorer static assets (shared Flask :5055)
    location ^~ /static/ { proxy_pass http://127.0.0.1:5055; proxy_set_header Host $host; }

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
        try_files $uri =404;
    }

    location ~* \.(css|js|map|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot|pdf|wasm|glb|gltf|bin|splat|ksplat|drc|ktx2)$ {
        expires 7d; add_header Cache-Control "public";
        try_files $uri =404;
    }

    # IIIF (shared Cantaloupe :8182) with Laravel passthroughs
    location = /iiif/discovery/changes { try_files $uri /index.php?$query_string; }
    location ^~ /iiif/auth/2/          { try_files $uri /index.php?$query_string; }
    location ^~ /iiif/content-state/   { try_files $uri /index.php?$query_string; }
    location = /iiif/workspaces        { try_files $uri /index.php?$query_string; }
    location ^~ /iiif/3d/              { try_files $uri /index.php?$query_string; }
    location ^~ /iiif/ {
        proxy_pass http://127.0.0.1:8182/iiif/;
        proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host; proxy_set_header X-Forwarded-Port $server_port;
        add_header Access-Control-Allow-Origin "*" always;
        sub_filter_types application/json application/ld+json;
        sub_filter_once off;
        sub_filter 'http://127.0.0.1:8182' 'http://$host:8090';
    }

    location ~ /\.(ht|git|svn|env) { deny all; }
    location = /composer.json { deny all; }
    location = /CLAUDE.md     { deny all; }
    location ~ ^/\.env(\.|$)   { deny all; }

    location ^~ /storage/blog-files/ {
        alias /usr/share/nginx/heratio-dev/storage/app/public/blog-files/;
        add_header Content-Disposition "attachment";
        try_files $uri =404;
    }
    location ~ ^/(?:vendor|storage|database|config|bootstrap|tests|node_modules)/ { deny all; }

    # RiC API: Laravel-handled routes vs Flask catch-all (shared :5055)
    location /ric-api/data         { try_files $uri /index.php?$query_string; }
    location /ric-api/view-mode    { try_files $uri /index.php?$query_string; }
    location /ric-api/relations    { try_files $uri /index.php?$query_string; }
    location /ric-api/graph-summary { try_files $uri /index.php?$query_string; }
    location /ric-api/timeline     { try_files $uri /index.php?$query_string; }
    location /ric-api/explain      { try_files $uri /index.php?$query_string; }
    location /ric-api/connections  { try_files $uri /index.php?$query_string; }
    location /ric-api  { proxy_pass http://127.0.0.1:5055; proxy_set_header Host $host; }
    location /explorer { proxy_pass http://127.0.0.1:5055; proxy_set_header Host $host; }
    location /sparql   { proxy_pass http://127.0.0.1:5055; proxy_set_header Host $host; }

    location / { try_files $uri $uri/ /index.php?$query_string; }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }
}
