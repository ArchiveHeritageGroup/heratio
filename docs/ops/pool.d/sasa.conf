; #1446 - dedicated php-fpm pool for sasaarchive.theahg.co.za, isolated from the
; shared www pool. Mirrors www.conf's directives; own socket + worker budget.
[sasa]
user = www-data
group = www-data
listen = /run/php-fpm.sasa.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = dynamic
pm.max_children = 15
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500
pm.status_path = /fpm-status
slowlog = /var/log/php8.3-fpm.sasa.slow.log
request_slowlog_timeout = 5s
request_terminate_timeout = 90s
catch_workers_output = no
php_admin_value[error_reporting] = E_ALL & ~E_NOTICE & ~E_WARNING & ~E_DEPRECATED & ~E_STRICT
php_admin_flag[display_errors] = Off
php_admin_value[error_log] = /var/log/php-psis-error.log
php_admin_flag[log_errors] = on
