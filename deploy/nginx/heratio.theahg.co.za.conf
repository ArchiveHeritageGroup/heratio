##
# Heratio - heratio.theahg.co.za -> 301 redirect to canonical heratio.org
# Canonical domain cutover 2026-07-19. This host previously served the app;
# the full original vhost is backed up alongside as
#   heratio.theahg.co.za.conf.DISABLED-bak-20260719
# The app now lives on https://heratio.org (see heratio.org.conf).
##

server {
    include snippets/bad-bot-guard.conf;
    listen 80;
    listen [::]:80;
    server_name heratio.theahg.co.za;
    return 301 https://heratio.org$request_uri;
}

server {
    include snippets/bad-bot-guard.conf;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name heratio.theahg.co.za;

    ssl_certificate /etc/letsencrypt/live/theahg.co.za/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/theahg.co.za/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    return 301 https://heratio.org$request_uri;
}
