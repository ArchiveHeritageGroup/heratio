##
# Heratio — nginx vhost template
##
# Rendered by bin/install with placeholders substituted:
#   sasaarchive.theahg.co.za         — e.g. mysite.example
#   /usr/share/nginx/sasa    — e.g. /usr/share/nginx/heratio
#   /usr/share/nginx/sasa/uploads   — e.g. /mnt/nas/heratio  (HERATIO_UPLOADS_PATH parent)
#   /run/php/php8.3-fpm.sock   — e.g. /run/php/php8.3-fpm.sock
##
# This template is HTTP-only by default. SSL setup is the operator's concern
# (recommended: certbot --nginx -d sasaarchive.theahg.co.za after the vhost is in place).
##

server {
    include snippets/bad-bot-guard.conf;
    server_name sasaarchive.theahg.co.za;
    include snippets/facet-crawl-guard.conf;

    client_max_body_size 2G;

    root /usr/share/nginx/sasa/public;
    index index.php;

    access_log /var/log/nginx/heratio_access.log;
    error_log  /var/log/nginx/heratio_error.log;

    # ------------------------------------------------------------------
    # Security headers — defaults sufficient for OWASP top-10 baseline.
    # Tighten CSP / Permissions-Policy per deployment after testing.
    # HSTS is OFF here (HTTP-only template); when you add SSL via certbot
    # or otherwise, add the matching `Strict-Transport-Security` header
    # in the 443 server block.
    # ------------------------------------------------------------------
    add_header X-Frame-Options          "SAMEORIGIN"                       always;
    add_header X-Content-Type-Options   "nosniff"                          always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin"  always;
    add_header Permissions-Policy       "geolocation=(), microphone=(), camera=(self), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;
    add_header Cross-Origin-Opener-Policy   "same-origin"                  always;
    add_header Cross-Origin-Resource-Policy "same-site"                    always;
    # Content-Security-Policy is set by the APP, not here. Heratio ships a
    # nonce-based CSP via spatie/laravel-csp (app/Csp/HeratioCspPreset.php) that
    # already allows everything the viewers need (blob: for Mirador manifests +
    # OpenSeadragon/PDF.js/3D workers, the CDNs, etc.). Adding a SECOND CSP
    # header here makes the browser enforce the INTERSECTION of both, and this
    # simpler header's `connect-src 'self' https:` (no blob:) silently broke the
    # IIIF/Mirador viewer ("TypeError: Failed to fetch" on a blob: manifest).
    # Leave CSP to the app so there is a single source of truth.
    # X-XSS-Protection is deprecated by modern browsers (use CSP above) but
    # keeps legacy clients happy.
    add_header X-XSS-Protection         "1; mode=block"                    always;

    # ------------------------------------------------------------------
    # Uploaded media — alias to HERATIO_STORAGE_PATH. The ^~ prefix is
    # critical so the static-file regex below doesn't intercept tile
    # / image requests.
    # ------------------------------------------------------------------
    location ^~ /uploads/ {
        alias /usr/share/nginx/sasa/uploads/;
        expires 30d;
        access_log off;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # ------------------------------------------------------------------
    # IIIF — proxy to Cantaloupe (only active if bin/install-cantaloupe
    # has been run; otherwise this block 502s and the IIIF viewer just
    # falls back to the JPEG reference image).
    # ------------------------------------------------------------------
    include snippets/heratio-iiif.conf;

    # ------------------------------------------------------------------
    # Landing page: SASA lands on the heritage portal, not Heratio's home.
    # Exact-match only, so every other path still reaches Laravel below.
    # Revert by deleting this block (no Heratio source is forked).
    # ------------------------------------------------------------------
    location = / {
        return 302 /heritage;
    }

    # ------------------------------------------------------------------
    # Laravel front controller
    # ------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/run/php-fpm.sasa.sock;  
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 300;
    }

    # Static asset cache
    location ~* \.(jpg|jpeg|png|gif|webp|svg|ico|css|js|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Block sensitive files / config / source artefacts
    location ~ /\.(?!well-known)               { deny all; }
    location = /.env                            { deny all; }
    location ~* /(?:vendor|storage|database|config|bootstrap)/  { deny all; }
    location ~* \.(env|sql|log|md|yml|yaml|lock|json5)$ { deny all; }
    location ~* /(?:composer\.(json|lock)|package\.(json|lock))$ { deny all; }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/sasaarchive.theahg.co.za/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/sasaarchive.theahg.co.za/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    include snippets/bad-bot-guard.conf;
    if ($host = sasaarchive.theahg.co.za) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name sasaarchive.theahg.co.za;
    include snippets/facet-crawl-guard.conf;
    return 404; # managed by Certbot


}