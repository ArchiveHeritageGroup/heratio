# Load-shedding for Heratio's faceted browse endpoints.
#
# WHY NOT per-IP: on 2026-08-24 heratio.org took 36,157 requests to
# /actor/browse from 31,722 DISTINCT IPs - about one request per address, with
# rotating desktop-browser user agents. A per-IP limit is exactly what that
# traffic is shaped to defeat, and the existing $block_facet_crawl guard cannot
# see it either: that fires only on a bot-shaped User-Agent AND bracket array
# params (AtoM's creator%5B0%5D=), and this has neither - Heratio's facets are
# flat (maintainedBy=, sf_culture=, displayMode=).
#
# WHY NOT caching: 28,063 of the 30,445 distinct URLs were requested exactly
# once, so the best possible hit ratio is ~9%. A facet space is not cacheable
# by construction.
#
# So the key is $server_name - ONE counter for the whole vhost, i.e. a global
# cap on how many browse requests may be in flight at once. The pool is
# pm.max_children=25 and every page costs ~1s, so capping browse at 12 leaves
# 13 workers for the rest of the site. Excess browse requests are refused
# immediately instead of queueing and starving everything else, which is what
# produced the intermittent 502s a user reported as an authority-record error.
limit_conn_zone $server_name zone=heratio_browse:1m;

# --- Facet-crawl guard, Heratio shape (#1484) -------------------------------
# conf.d/bot-blocker.conf already defines $is_crawler and $has_facet_params, and
# snippets/facet-crawl-guard.conf 429s their combination. That guard is included
# in the Heratio vhosts and has never fired on one: $has_facet_params matches
# AtoM's ARRAY facets (creator%5B0%5D=) and Heratio builds flat scalar facets
# (maintainedBy=, entityType=, displayMode=, hasDigital=, topLevel=). Of 36,157
# requests to /actor/browse on 2026-08-24, none could match.
#
# Matching on the NUMBER of parameters rather than their names: the facet space
# differs per application and endpoint, and a name list goes stale the first time
# a filter is added. Measured on a 2,000-URL sample of real browse traffic, 1,834
# carried seven or more parameters. The threshold is 4, so a language switch plus
# pagination plus one filter is still allowed.
#
# DEFINED HERE, NOT IN bot-blocker.conf, DELIBERATELY. Adding it to the shared
# map changed behaviour on the AtoM vhosts that also include that snippet - a
# Googlebot request to atom.theahg.co.za's browse began returning 429. Those
# instances belong to another project; a rule written for Heratio's URL shape
# should not silently re-tune their crawler policy. This variable is referenced
# only from the Heratio vhost.
map $args $ahg_many_params {
    default 0;
    "~^([^&]*&){3}"  1;    # 4 or more query parameters
}

# --- No-referer facet stacking (2026-10-12) ---------------------------------
# The guard above needs a bot-shaped User-Agent. On 2026-10-12 heratio.org took
# 120,979 browse requests from 63,682 distinct IPs with ordinary desktop Chrome
# user agents, so it never fired. What does tell them apart: a person who
# narrows a browse page clicks a facet link ON the site, so the request carries
# a heratio.org Referer. Of the requests combining two or more facets, about 95%
# carried no Referer at all. So two or more flat facets on a browse path, with
# no same-site Referer, is refused. One facet, plain browse and anything clicked
# from a heratio.org page are unaffected.
map $http_referer $ahg_same_site_ref {
    default 0;
    "~^https?://(www\.)?heratio\.(org|theahg\.co\.za)/"  1;
}

map $args $ahg_two_facets {
    default 0;
    "~(^|&)(subject|place|genre|level|repo|creator|type|hasDigital|maintainedBy|media|mediaType|entityType|languages)=[^&]*&(.*&)?(subject|place|genre|level|repo|creator|type|hasDigital|maintainedBy|media|mediaType|entityType|languages)="  1;
}

map "$ahg_same_site_ref:$ahg_two_facets:$uri" $ahg_noref_facets {
    default 0;
    "~^0:1:/(glam|actor|dam|repository|library|museum|gallery)/browse"  1;
}

map "$is_crawler:$ahg_many_params:$ahg_noref_facets" $ahg_block_facet_crawl {
    default 0;
    "~^1:1:"  1;
    "~:1$"    1;
}

# --- Machine doors (heratio#1544) -------------------------------------------
# The API, OAI-PMH, ResourceSync, robots.txt and the sitemap are meant for
# scripts and harvesters, and they carry their own keys and rate limits. The
# shared $bad_bot map drops the default user agents of Python's requests, urllib
# and httpx, Node's fetch and axios, Go and Java with a 444, so a harvester or an
# AI agent with a valid key was cut off before the key was ever checked. Used
# only by the Heratio vhost, so the AtoM vhosts keep their own policy.
map $request_uri $ahg_machine_route {
    default 0;
    "~^/api/v[12](/|\?|$)"           1;
    "~^/oai(\?|$)"                    1;
    "~^/\.well-known/resourcesync"     1;
    "~^/resourcesync/"                 1;
    "~^/sitemap[^/]*\.xml"             1;
    "~^/robots\.txt"                   2;
}

# Bulk AI-training crawlers stay refused on the machine doors too (the access
# policy), except robots.txt, which they may read so they can see they are not
# welcome. Keep this list in step with $bad_bot in conf.d/bot-blocker.conf.
map $http_user_agent $ahg_ai_trainer {
    default 0;
    "~*(GPTBot|ClaudeBot|anthropic-ai|CCBot|Amazonbot|Bytespider|meta-externalagent)" 1;
}

map "$ahg_machine_route:$ahg_ai_trainer" $ahg_machine_door {
    default 0;
    "1:0"  1;
    "~^2:" 1;
}
