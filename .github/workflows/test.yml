name: Heratio Test Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Test suite to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - unit
          - feature
          - critical
          - packages
          - e2e

env:
  COVERAGE_MIN_APP: 50
  COVERAGE_MIN_PACKAGES: 30
  COVERAGE_MIN_CHANGED: 60
  DB_CONNECTION: mysql
  DB_HOST: 127.0.0.1
  DB_PORT: 3306
  DB_DATABASE: heratio_test
  DB_USERNAME: root
  DB_PASSWORD: root
  DB_SOCKET: ""
  APP_ENV: testing
  CACHE_DRIVER: array
  SESSION_DRIVER: array
  QUEUE_CONNECTION: sync
  HERATIO_URL: https://heratio.theahg.co.za
  PSIS_URL: https://psis.theahg.co.za

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql, mbstring, xml, gd, zip, bcmath
          coverage: none
      - name: Prepare .env.testing (copy template, blank placeholders)
        run: |
          cp .env.testing.example .env.testing
          sed -i "s|<<set in your local .env.testing>>||g" .env.testing
          sed -i "s|^DB_SOCKET=.*|DB_SOCKET=|" .env.testing
          # PDO MySQL treats DB_HOST=localhost as "use the unix socket" even
          # when DB_SOCKET is blank, falling back to the missing default
          # /var/run/mysqld/mysqld.sock on the runner. Force TCP via 127.0.0.1.
          sed -i "s|^DB_HOST=.*|DB_HOST=127.0.0.1|" .env.testing
          sed -i "s|^DB_CONNECTION=.*|DB_CONNECTION=mysql|" .env.testing
          sed -i "s|^DB_DATABASE=.*|DB_DATABASE=heratio_test|" .env.testing
          sed -i "s|^DB_PASSWORD=.*|DB_PASSWORD=root|" .env.testing
      - run: composer install --no-interaction --prefer-dist
      - name: PHP Syntax Check
        # Per-file `php -l`. Any non-zero exit fails the job. The previous
        # implementation piped to `grep -v "No syntax errors"` which silently
        # passed when there were no errors (grep returns 1 on no match) and
        # could mask broken syntax depending on shell pipefail settings.
        run: |
          find app packages -name "*.php" \
              -not -name "*.blade.php" \
              -not -path '*/vendor/*' \
              -not -path '*/worktree/*' \
              -print0 | xargs -0 -n1 -P4 php -l > /dev/null

      # #1478. `php -l` cannot see this class of defect: a Blade view reading
      # $row->prop with a ?? fallback, where the query behind that row never
      # produces prop. It is valid PHP, so it never errors - the fallback simply
      # fires on every row and the screen reports a value that is not the data.
      # Three shipped that way (the loan-rules screen, the checkout preview, and
      # the overdue list, which showed a blank patron / 0 days / 0.00 fine on
      # every row for its whole life).
      #
      # This gate does NOT fail on the existing 131 findings - fixing those is a
      # separate project, tracked on #1478 and recorded in
      # tools/blade-bindings-baseline.txt. It fails only on something NEW, so the
      # population cannot grow while triage proceeds, and the baseline may only
      # shrink. Needs no database: the scan is repo-only and deterministic.
      - name: Blade binding check (#1478 - no NEW always-fallback bindings)
        run: php tools/scan-blade-bindings.php --check

      # The other half of the same defect family (#1481). The binding scanner
      # finds a view READING what its query never produces; this finds a form
      # WRITING what no PHP ever reads. Neither can see the other's class: the
      # exhibition storyline form contributed one binding finding while having
      # four broken fields and no POST route, which is why #1478's count was a
      # floor rather than a total. Same shrink-only baseline, same no-database
      # requirement.
      - name: Form field check (#1481 - no NEW unconsumed form fields)
        run: php tools/scan-form-fields.php --check

  # #48 security gates: gitleaks (fail) + composer audit (warn) + npm audit (fail at high+).
  # The 2026-04-30 credential leak (Merlot@123 et al.) is the motivation here -
  # gitleaks would have caught the secret before it landed in git history.
  # composer / npm audit catch known-CVE deps; npm fails at high+ severity,
  # composer warn-only because false positives are common in archival deps.
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks needs full history to scan
      - name: Gitleaks - secret detection (CLI)
        # The gitleaks-action@v2 now requires a paid GITLEAKS_LICENSE secret for
        # org repos (breaking change) — it was failing the Security Audit job
        # with "missing gitleaks license". The gitleaks CLI binary itself needs
        # no license, so we run it directly. Full history is available
        # (fetch-depth: 0). --exit-code 1 fails the job on any finding.
        run: |
          GL=8.18.4
          curl -sSLf "https://github.com/gitleaks/gitleaks/releases/download/v${GL}/gitleaks_${GL}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          # Scan the WORKING TREE (--no-git), not full history: the repo carries
          # rotated historical secrets in old commits (the 2026-04-30 leak that
          # motivated this gate) which can't be un-committed without a history
          # rewrite. --no-git checks the files actually shipped today. Known
          # doc-placeholder findings are baselined in .gitleaksignore.
          /tmp/gitleaks detect --no-git --source . --redact --no-banner --exit-code 1
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: composer audit (warn-only, common false positives in archival deps)
        run: composer audit --no-interaction || echo "composer audit found advisories (non-fatal)"
      - name: Setup Node for npm audit
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: npm audit (fail at high+ severity)
        run: |
          if [ -f package.json ]; then
            npm audit --audit-level=high
          else
            echo "No package.json at repo root; skipping npm audit."
          fi

  laravel-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: heratio_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql, mbstring, xml, gd, zip, bcmath
          coverage: pcov
      - name: Prepare .env.testing (copy template, blank placeholders)
        run: |
          cp .env.testing.example .env.testing
          sed -i "s|<<set in your local .env.testing>>||g" .env.testing
          sed -i "s|^DB_SOCKET=.*|DB_SOCKET=|" .env.testing
          # PDO MySQL treats DB_HOST=localhost as "use the unix socket" even
          # when DB_SOCKET is blank, falling back to the missing default
          # /var/run/mysqld/mysqld.sock on the runner. Force TCP via 127.0.0.1.
          sed -i "s|^DB_HOST=.*|DB_HOST=127.0.0.1|" .env.testing
          sed -i "s|^DB_CONNECTION=.*|DB_CONNECTION=mysql|" .env.testing
          sed -i "s|^DB_DATABASE=.*|DB_DATABASE=heratio_test|" .env.testing
          sed -i "s|^DB_PASSWORD=.*|DB_PASSWORD=root|" .env.testing
      - run: composer install --no-interaction --prefer-dist
      - name: Create database + load core schema + base seeds + run migrations
        # bin/install Stage 6 loads database/core/0[0-3]_*.sql (schema, ~995
        # tables: object, information_object, actor, term, slug, ...) and
        # Stage 8 loads database/seeds/0[0-6]_*.sql (base taxonomies, including
        # term IDs 131/132/133 for Corporate body / Person / Family). Tests
        # need both: schema alone gives FK violations like
        # "actor_FK_2 references term(id)" when ActorFactory inserts entity_type_id=132.
        # 07_report_templates.sql is skipped because the report_template table
        # is created by ahg-reports' install.sql at app boot, not in core schema.
        #
        # IMPORTANT: phpunit.xml configures DB_USERNAME=heratio_test /
        # DB_PASSWORD=H3ratio_Test!Local. The test runner will connect as
        # heratio_test — not root — so we must create and grant that user here.
        # Loading the schema as root while tests connect as a non-existent user
        # causes ~110 "Table 'heratio_test.object' doesn't exist" failures
        # (issue #1136). CREATE USER + GRANT is idempotent — safe on re-runs.
        run: |
          mysql -h 127.0.0.1 -u root -proot -e "CREATE DATABASE IF NOT EXISTS heratio_test;"
          mysql -h 127.0.0.1 -u root -proot -e "CREATE USER IF NOT EXISTS 'heratio_test'@'%' IDENTIFIED BY 'H3ratio_Test!Local'; GRANT ALL PRIVILEGES ON heratio_test.* TO 'heratio_test'@'%'; FLUSH PRIVILEGES;"
          for f in database/core/0*.sql; do
            echo "Loading $f"
            mysql -h 127.0.0.1 -u root -proot heratio_test < "$f"
          done
          for f in database/seeds/0[0-6]_*.sql; do
            echo "Seeding $f"
            mysql -h 127.0.0.1 -u root -proot heratio_test < "$f"
          done
          # #1471: CI built its test database from core SQL + seeds and never ran
          # migrations, so it tested a schema no deployed instance runs - 142 tables
          # behind dev, with migration-only hardening simply absent. The status.id
          # FK from #1470 is the worked example: without it CI accepts an id-less
          # INSERT that every real instance rejects, so a whole class of defect can
          # be reintroduced with CI staying green. Runs AFTER the seeds because the
          # backfill migrations rehome seeded rows. Root credentials because the
          # schema above was loaded as root; --env=testing supplies APP_KEY.
          DB_HOST=127.0.0.1 DB_DATABASE=heratio_test DB_USERNAME=root DB_PASSWORD=root \
            php artisan migrate --force --env=testing
      - name: Run Unit Tests
        run: |
          php -d pcov.enabled=1 ./vendor/bin/phpunit --testsuite=Unit --colors=always --testdox

